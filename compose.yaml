
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ordenes-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ordenes_network
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C -Q "SELECT 1" -b
          > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ordenes-api:v1.0
    container_name: ordenes-api
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: OrdenesDB
      DB_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "5000:5000"
    networks:
      - ordenes_network
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ordenes-web:v1.0
    container_name: ordenes-web
    environment:
      API_URL: http://api:5000
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    ports:
      - "8000:8000"
    networks:
      - ordenes_network
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:

networks:
  ordenes_network:
    driver: bridge
